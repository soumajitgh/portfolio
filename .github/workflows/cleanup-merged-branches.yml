name: Cleanup Merged Branches

on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: '0 0 * * 0' # Weekly sweep on Sundays at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete Merged Branches
    runs-on: ubuntu-latest
    steps:
      - name: Delete Merged Head Branch on PR Merge
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const headRepo = pr.head.repo ? pr.head.repo.full_name : null;
            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            const branchName = pr.head.ref;

            const protectedBranches = new Set(['main', 'master', 'dev', 'develop', 'staging', 'production']);
            if (protectedBranches.has(branchName) || branchName.startsWith('release/')) {
              console.log(`Branch "${branchName}" is protected. Skipping deletion.`);
              return;
            }

            if (headRepo !== baseRepo) {
              console.log(`PR originated from fork "${headRepo}". Skipping deletion.`);
              return;
            }

            try {
              console.log(`Deleting merged branch "${branchName}"...`);
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`,
              });
              console.log(`Successfully deleted branch "${branchName}".`);
            } catch (error) {
              if (error.status === 422 || error.status === 404) {
                console.log(`Branch "${branchName}" was already deleted or not found.`);
              } else {
                throw error;
              }
            }

      - name: Sweep Stale Merged Branches
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const protectedBranches = new Set(['main', 'master', 'dev', 'develop', 'staging', 'production']);

            const { data: repoData } = await github.rest.repos.get({ owner, repo });
            protectedBranches.add(repoData.default_branch);

            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'closed',
              base: repoData.default_branch,
              per_page: 100,
            });

            const { data: branches } = await github.rest.repos.listBranches({
              owner,
              repo,
              protected: false,
              per_page: 100,
            });

            const branchMap = new Map(branches.map((b) => [b.name, b]));

            for (const pr of pullRequests) {
              if (!pr.merged_at) continue;
              const branchName = pr.head.ref;
              const isSameRepo = pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`;

              if (!isSameRepo || protectedBranches.has(branchName) || branchName.startsWith('release/')) {
                continue;
              }

              if (branchMap.has(branchName)) {
                try {
                  console.log(`Deleting stale merged branch: ${branchName}`);
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `heads/${branchName}`,
                  });
                  console.log(`Successfully deleted ${branchName}`);
                } catch (err) {
                  console.warn(`Could not delete branch ${branchName}:`, err.message);
                }
              }
            }
